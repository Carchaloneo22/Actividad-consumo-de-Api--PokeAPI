<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Pokedex · API Pokémon</title>
  <style>
    /* Reset y base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #dc0a2d 0%, #b0021f 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Encabezado */
    .pokedex-header {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      padding: 1rem 2rem;
      border-radius: 60px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .pokedex-header h1 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 2.2rem;
      font-weight: 700;
      color: #f8f0e3;
      text-shadow: 3px 3px 0 #5c0010;
      letter-spacing: 1px;
    }

    .pokedex-header h1 span {
      background: #f8f0e3;
      color: #b0021f;
      padding: 0.2rem 1rem;
      border-radius: 50px;
      font-size: 1.6rem;
      text-shadow: none;
      box-shadow: inset 0 -3px 0 #8a0018;
    }

    .search-box {
      display: flex;
      gap: 8px;
      background: #f8f0e3;
      padding: 0.4rem 0.4rem 0.4rem 1.2rem;
      border-radius: 60px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
      border: 2px solid #f8f0e3;
      flex-wrap: wrap;
    }

    .search-box input {
      border: none;
      background: transparent;
      padding: 0.6rem 0.2rem;
      font-size: 1.1rem;
      min-width: 180px;
      outline: none;
      color: #1e1e2a;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: #5a5a6e;
      font-weight: 400;
      opacity: 0.7;
    }

    .search-box button {
      background: #dc0a2d;
      border: none;
      padding: 0.6rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.1rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 0 #7a0015;
      border: 1px solid #ff4d6a;
      letter-spacing: 0.5px;
    }

    .search-box button:hover {
      transform: translateY(-2px);
      background: #f0103a;
      box-shadow: 0 6px 0 #7a0015;
    }

    .search-box button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a0015;
    }

    /* Grid de la Pokedex */
    .pokedex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.8rem;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Tarjeta Pokémon */
    .pokemon-card {
      background: #f8f0e3;
      border-radius: 28px;
      padding: 1.2rem 0.8rem 1.2rem 0.8rem;
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.4), inset 0 -6px 0 #b0a090;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s ease;
      border: 2px solid #ffe6d5;
      backdrop-filter: blur(2px);
      cursor: default;
    }

    .pokemon-card:hover {
      transform: scale(1.02) translateY(-6px);
      box-shadow: 0 22px 34px rgba(0, 0, 0, 0.5), inset 0 -6px 0 #b0a090;
      border-color: #ffc4b0;
    }

    .pokemon-sprite {
      width: 100%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5d8c4;
      border-radius: 40px;
      padding: 0.3rem;
      box-shadow: inset 0 -6px 0 #b8a690, 0 8px 12px rgba(0,0,0,0.2);
      margin-bottom: 0.6rem;
    }

    .pokemon-sprite img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      image-rendering: crisp-edges;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
      transition: 0.2s;
    }

    .pokemon-card:hover .pokemon-sprite img {
      transform: scale(1.05);
    }

    .pokemon-id {
      background: #1e1e2a;
      color: #f8f0e3;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      letter-spacing: 0.5px;
      align-self: flex-start;
      margin-left: 0.2rem;
      box-shadow: 0 2px 0 #3a3a4a;
    }

    .pokemon-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e1e2a;
      text-transform: capitalize;
      margin: 0.2rem 0 0.1rem;
      letter-spacing: -0.5px;
    }

    .pokemon-types {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }

    .type-badge {
      background: #d0c0b0;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #1e1e2a;
      box-shadow: inset 0 -2px 0 #9a8a7a;
      border: 1px solid #efe0d0;
    }

    /* Colores de tipos (solo algunos para dar vida) */
    .type-grass { background: #7ac74c; border-color: #5f9d3a; }
    .type-fire { background: #ee8130; border-color: #c96a1e; color: #1e1e1a; }
    .type-water { background: #6390f0; border-color: #3d6bc9; color: #f0f4ff; }
    .type-bug { background: #a6b91a; border-color: #7d8f12; }
    .type-normal { background: #a8a77a; border-color: #81835a; }
    .type-electric { background: #f7d02c; border-color: #c9a81e; color: #1e1e1a; }
    .type-ice { background: #96d9d6; border-color: #5fa8a5; }
    .type-fighting { background: #c22e28; border-color: #9c1e18; color: #f0e6e0; }
    .type-poison { background: #a33ea1; border-color: #7d2f7b; color: #f0e6f0; }
    .type-ground { background: #e2bf65; border-color: #b8973a; }
    .type-flying { background: #a98ff3; border-color: #7a63c9; }
    .type-psychic { background: #f95587; border-color: #d43a66; color: #f0e6ea; }
    .type-rock { background: #b6a136; border-color: #8a7a28; }
    .type-ghost { background: #735797; border-color: #533b72; color: #f0e6f5; }
    .type-dragon { background: #6f35fc; border-color: #4d22b3; color: #f0ecff; }
    .type-dark { background: #705746; border-color: #4d3a2f; color: #f0eae6; }
    .type-steel { background: #b7b7ce; border-color: #8a8aa8; }
    .type-fairy { background: #d685ad; border-color: #b85a85; }

    /* Mensajes de estado */
    .status-msg {
      color: #f8f0e3;
      font-size: 1.3rem;
      font-weight: 600;
      background: rgba(0,0,0,0.3);
      padding: 0.8rem 2rem;
      border-radius: 80px;
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255,255,240,0.3);
      margin: 2rem 0;
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    .loader {
      border: 6px solid rgba(255, 255, 240, 0.2);
      border-top: 6px solid #f8f0e3;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 700px) {
      body { padding: 1rem 0.8rem; }
      .pokedex-header {
        flex-direction: column;
        gap: 1rem;
        align-items: stretch;
        padding: 1.2rem 1.5rem;
        border-radius: 40px;
      }
      .pokedex-header h1 {
        font-size: 1.8rem;
        justify-content: center;
      }
      .search-box {
        padding: 0.4rem;
        flex-wrap: nowrap;
      }
      .search-box input {
        min-width: 120px;
        font-size: 1rem;
        flex: 1;
      }
      .search-box button {
        padding: 0.5rem 1.2rem;
        font-size: 1rem;
      }
      .pokedex-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1.2rem;
      }
    }

    @media (max-width: 450px) {
      .pokedex-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.8rem;
      }
      .pokemon-card {
        padding: 0.8rem 0.4rem;
      }
      .pokemon-name {
        font-size: 1.1rem;
      }
      .pokemon-sprite {
        border-radius: 28px;
      }
      .search-box input {
        min-width: 70px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <header class="pokedex-header">
    <h1>
      <span>⚡</span> Pokedex
    </h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Nombre o Nº" aria-label="Buscar Pokémon">
      <button id="searchBtn">Buscar</button>
    </div>
  </header>

  <div id="statusContainer" class="status-msg" style="display: none;"></div>
  <div id="loaderContainer" class="loader" style="display: none;"></div>

  <div id="pokedexGrid" class="pokedex-grid"></div>

  <script>
    (function() {
      const pokedexGrid = document.getElementById('pokedexGrid');
      const statusContainer = document.getElementById('statusContainer');
      const loaderContainer = document.getElementById('loaderContainer');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      // Estado
      let allPokemon = [];          // lista de { name, url }
      let currentPokemonData = [];  // datos completos de los pokémon mostrados

      // ---------- funciones auxiliares ----------
      function showStatus(message, isError = false) {
        statusContainer.textContent = message;
        statusContainer.style.display = 'block';
        statusContainer.style.background = isError ? 'rgba(180, 10, 30, 0.8)' : 'rgba(0, 0, 0, 0.4)';
        loaderContainer.style.display = 'none';
      }

      function hideStatus() {
        statusContainer.style.display = 'none';
      }

      function showLoader() {
        loaderContainer.style.display = 'block';
        statusContainer.style.display = 'none';
        pokedexGrid.innerHTML = '';
      }

      function hideLoader() {
        loaderContainer.style.display = 'none';
      }

      // ---------- renderizar tarjetas ----------
      function renderPokemonList(pokemonArray) {
        if (!pokemonArray || pokemonArray.length === 0) {
          pokedexGrid.innerHTML = '';
          showStatus('No se encontraron Pokémon 🧐', true);
          return;
        }

        hideStatus();
        pokedexGrid.innerHTML = '';

        pokemonArray.forEach(pokemon => {
          const card = document.createElement('div');
          card.className = 'pokemon-card';

          // ID formateado
          const id = pokemon.id.toString().padStart(3, '0');

          // Sprite (oficial)
          const spriteUrl = pokemon.sprites?.other?.['official-artwork']?.front_default ||
                            pokemon.sprites?.front_default ||
                            '';

          // Tipos
          const types = pokemon.types.map(t => t.type.name);
          const typeBadges = types.map(type => {
            const typeClass = `type-${type}`;
            return `<span class="type-badge ${typeClass}">${type}</span>`;
          }).join('');

          card.innerHTML = `
            <div class="pokemon-sprite">
              <img src="${spriteUrl}" alt="${pokemon.name}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23d0c0b0%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2230%22 fill=%22%235a4a3a%22%3E?%3C/text%3E%3C/svg%3E'">
            </div>
            <span class="pokemon-id">#${id}</span>
            <span class="pokemon-name">${pokemon.name}</span>
            <div class="pokemon-types">${typeBadges}</div>
          `;

          pokedexGrid.appendChild(card);
        });
      }

      // ---------- obtener y mostrar pokémon filtrados ----------
      function filterAndDisplay(searchTerm = '') {
        if (!allPokemon.length) return;

        const term = searchTerm.trim().toLowerCase();
        let filtered = [];

        if (term === '') {
          // si no hay búsqueda, mostramos todos (primeros 151)
          filtered = allPokemon.slice(0, 151);
        } else {
          // Buscar por nombre o número
          filtered = allPokemon.filter(p => {
            const nameMatch = p.name.toLowerCase().includes(term);
            const idMatch = p.id.toString() === term;
            return nameMatch || idMatch;
          });
        }

        if (filtered.length === 0) {
          pokedexGrid.innerHTML = '';
          showStatus(`No hay resultados para "${term}"`, true);
          return;
        }

        // Si el filtro es exacto y hay un solo resultado, podríamos cargar más datos, pero ya tenemos todo.
        // (Ya tenemos los datos completos porque los precargamos)
        renderPokemonList(filtered);
        currentPokemonData = filtered;
      }

      // ---------- precargar todos los Pokémon (1-151) ----------
      async function loadAllPokemon() {
        showLoader();
        try {
          const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=151');
          if (!response.ok) throw new Error('Error al cargar la lista');

          const data = await response.json();
          const results = data.results;

          // Obtener datos completos de cada uno en paralelo (máx 151)
          const fetchPromises = results.map(async (item, index) => {
            try {
              const res = await fetch(item.url);
              if (!res.ok) throw new Error(`Error al obtener ${item.name}`);
              return await res.json();
            } catch (err) {
              console.warn(`Fallo al cargar ${item.name}:`, err);
              // fallback con datos mínimos para no romper la UI
              return {
                id: index + 1,
                name: item.name,
                sprites: { front_default: '' },
                types: [{ type: { name: 'unknown' } }]
              };
            }
          });

          const pokemonData = await Promise.all(fetchPromises);
          // Ordenar por id
          pokemonData.sort((a, b) => a.id - b.id);
          allPokemon = pokemonData;

          hideLoader();
          hideStatus();
          // Mostrar los primeros 151 (todos)
          const displayData = allPokemon.slice(0, 151);
          renderPokemonList(displayData);
          currentPokemonData = displayData;

        } catch (error) {
          console.error('Error cargando Pokedex:', error);
          hideLoader();
          showStatus('Error al cargar la Pokedex. Intenta de nuevo.', true);
        }
      }

      // ---------- búsqueda por nombre o número ----------
      function performSearch() {
        const query = searchInput.value.trim();
        if (query === '') {
          // mostrar todos
          const displayData = allPokemon.slice(0, 151);
          renderPokemonList(displayData);
          currentPokemonData = displayData;
          hideStatus();
          return;
        }

        // Buscar en allPokemon (ya tenemos todos los datos)
        const term = query.toLowerCase();
        const filtered = allPokemon.filter(p => {
          const nameMatch = p.name.toLowerCase().includes(term);
          const idMatch = p.id.toString() === term;
          return nameMatch || idMatch;
        });

        if (filtered.length === 0) {
          pokedexGrid.innerHTML = '';
          showStatus(`No se encontró "${query}"`, true);
          currentPokemonData = [];
        } else {
          renderPokemonList(filtered);
          currentPokemonData = filtered;
          hideStatus();
        }
      }

      // ---------- inicialización y eventos ----------
      function init() {
        // Cargar todos los Pokémon al inicio
        loadAllPokemon();

        // Eventos de búsqueda
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
          }
        });

        // Botón de búsqueda también con limpieza (si se deja vacío, muestra todo)
        // Pequeño extra: si se borra el input y se hace click, muestra todo
      }

      // Iniciar cuando el DOM esté listo
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
